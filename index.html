<!-- JUMLAH KERANJANG -->
<h3>🛒 Keranjang (<span id="jumlah-barang">0</span>)</h3>
<div id="daftar-keranjang">Keranjang masih kosong.</div>
<h3 id="total-harga">Total: Rp0</h3>

<script>
let keranjang = [];

function tambahBarang(nama, harga) {
  let barang = keranjang.find(item => item.nama === nama);

  if (barang) {
    barang.jumlah++;
  } else {
    keranjang.push({nama, harga, jumlah: 1});
  }

  tampilkanKeranjang();
  document.getElementById("daftar-keranjang")
    .scrollIntoView({behavior: "smooth", block: "center"});
}

function tampilkanKeranjang() {
  const daftar = document.getElementById("daftar-keranjang");
  daftar.innerHTML = "";

  let jumlah = 0;
  let total = 0;

  keranjang.forEach(item => {
    jumlah += item.jumlah;
    total += item.harga * item.jumlah;

    const baris = document.createElement("p");
    baris.textContent = item.nama + " × " + item.jumlah +
      " — Rp" + (item.harga * item.jumlah).toLocaleString("id-ID");
    daftar.appendChild(baris);
  });

  if (keranjang.length === 0) {
    daftar.textContent = "Keranjang masih kosong.";
  }

  document.getElementById("jumlah-barang").textContent = jumlah;
  document.getElementById("total-harga").textContent =
    "Total: Rp" + total.toLocaleString("id-ID");
}
</script>
