
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zeinshop313 - Toko Online</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f5dc;
      color: #333;
    }

    header {
      background: #e5f0d0;
      padding: 18px 10px;
      text-align: center;
    }

    header h1 {
      color: #ff7900;
      margin: 0 0 15px;
    }

    .cart {
      display: inline-block;
      background: #fff;
      padding: 10px 18px;
      border-radius: 25px;
      font-weight: bold;
      border: 1px solid #ddd;
    }

    #jumlah-keranjang {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      background: #f44336;
      color: white;
      width: 25px;
      height: 25px;
      border-radius: 50%;
      margin-left: 5px;
    }

    main {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      padding: 20px 10px;
    }

    .produk {
      background: white;
      width: 160px;
      padding: 12px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 2px 7px #0002;
    }

    .produk img {
      width: 100%;
      height: 140px;
      object-fit: contain;
    }

    .produk h3 {
      font-size: 16px;
    }

    .harga {
      color: #e65c00;
      font-weight: bold;
    }

    button {
      background: #168b45;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 7px;
      cursor: pointer;
      width: 100%;
      font-size: 14px;
    }

    button:active {
      background: #0c6030;
    }

    #isi-keranjang {
      margin: 10px;
      padding: 15px;
      background: white;
      border-radius: 10px;
    }

    .item-keranjang {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin: 10px 0;
      border-bottom: 1px solid #ddd;
      padding-bottom: 8px;
    }

    .hapus {
      width: auto;
      background: #d93025;
      padding: 5px 9px;
    }
  </style>
</head>

<body>

<header>
  <h1>Selamat Datang di Zeinshop313</h1>

  <div class="cart">
    🛒 Keranjang
    <span id="jumlah-keranjang">0</span>
  </div>
</header>

<main id="daftar-produk">

  <div class="produk">
    <img src="assets/kopi-jahe.jpg"
         alt="Kopi Jahe Sachet Ummi"
         onerror="this.style.display='none'">

    <h3>Kopi Jahe Sachet Ummi</h3>
    <p class="harga">Rp15.000</p>

    <button onclick="tambahKeranjang('Kopi Jahe Sachet Ummi', 15000)">
      + Tambah ke Keranjang
    </button>
  </div>

  <div class="produk">
    <img src="assets/mahadir.jpg"
         alt="Minyak Wangi Mahadir"
         onerror="this.style.display='none'">

    <h3>Minyak Wangi Mahadir</h3>
    <p class="harga">Rp25.000</p>

    <button onclick="tambahKeranjang('Minyak Wangi Mahadir', 25000)">
      + Tambah ke Keranjang
    </button>
  </div>

</main>

<section id="isi-keranjang">
  <h2>🛒 Isi Keranjang Belanja</h2>
  <div id="daftar-keranjang">Keranjang masih kosong.</div>
  <h3 id="total-harga">Total: Rp0</h3>
</section>

<script>
  let keranjang = [];

  function tambahKeranjang(nama, harga) {
    const barang = keranjang.find(item => item.nama === nama);

    if (barang) {
      barang.jumlah++;
    } else {
      keranjang.push({
        nama: nama,
        harga: harga,
        jumlah: 1
      });
    }

    tampilkanKeranjang();
  }

  function tampilkanKeranjang() {
    const jumlah = keranjang.reduce(
      (total, item) => total + item.jumlah, 0
    );

    document.getElementById("jumlah-keranjang").textContent = jumlah;

    const daftar = document.getElementById("daftar-keranjang");
    daftar.innerHTML = "";

    if (keranjang.length === 0) {
      daftar.textContent = "Keranjang masih kosong.";
    }

    let totalHarga = 0;

    keranjang.forEach((item, index) => {
      totalHarga += item.harga * item.jumlah;

      const baris = document.createElement("div");
      baris.className = "item-keranjang";

      const keterangan = document.createElement("span");
      keterangan.textContent =
        item.nama + " × " + item.jumlah + " — " +
        rupiah(item.harga * item.jumlah);

      const hapus = document.createElement("button");
      hapus.className = "hapus";
      hapus.textContent = "Hapus";
      hapus.onclick = function() {
        keranjang.splice(index, 1);
        tampilkanKeranjang();
      };

      baris.append(keterangan, hapus);
      daftar.appendChild(baris);
    });

    document.getElementById("total-harga").textContent =
      "Total: " + rupiah(totalHarga);
  }

  function rupiah(angka) {
    return "Rp" + angka.toLocaleString("id-ID");
  }
</script>

</body>
</html>
